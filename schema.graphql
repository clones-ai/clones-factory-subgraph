# Factory and Pool Management
type Factory @entity(immutable: false) {
  id: Bytes! # Factory contract address
  implementation: Bytes! # Implementation contract address
  treasury: Bytes! # Platform treasury address
  timelock: Bytes! # Timelock governance address
  guardian: Bytes! # Guardian address
  publisher: Bytes! # Current publisher address
  oldPublisher: Bytes # Previous publisher during rotation
  graceEndTime: BigInt # Grace period end time for old publisher
  totalPools: BigInt! # Total number of pools created
  isInitialized: Boolean! # Whether factory has been properly initialized
  createdAt: BigInt! # Block timestamp
  createdAtBlock: BigInt! # Block number
}

type Pool @entity(immutable: false) {
  id: Bytes! # Pool contract address
  factory: Factory! # Factory that created this pool
  creator: Bytes! # Pool creator address
  token: Token! # Reward token
  salt: Bytes! # CREATE2 salt used for deployment
  
  # Pool Statistics
  totalFunded: BigInt! # Total amount funded
  totalClaimed: BigInt! # Total amount claimed by all users
  totalFees: BigInt! # Total platform fees collected
  totalUsers: BigInt! # Number of unique users who claimed
  totalClaims: BigInt! # Number of total claims
  
  # Pool State
  isActive: Boolean! # Whether pool is active
  lastActivityAt: BigInt! # Last claim timestamp
  
  # Pool Metadata
  skills: [String!]!
  description: String
  searchString: String
  
  # Relations
  fundings: [Funding!]! @derivedFrom(field: "pool")
  withdrawals: [Withdrawal!]! @derivedFrom(field: "pool")
  claims: [Claim!]! @derivedFrom(field: "pool")
  
  # Timestamps
  createdAt: BigInt!
  createdAtBlock: BigInt!
  updatedAt: BigInt!
}

type Token @entity(immutable: false) {
  id: Bytes! # Token contract address
  symbol: String! # Token symbol (USDC, WETH, etc)
  name: String! # Token name
  decimals: Int! # Token decimals
  isAllowed: Boolean! # Whether token is currently allowed
  
  # Token Statistics
  totalPools: BigInt! # Number of pools using this token
  totalVolume: BigInt! # Total volume across all pools
  totalFees: BigInt! # Total fees collected in this token
  
  # Timestamps
  createdAt: BigInt!
  updatedAt: BigInt!
}

# User Activities and Claims
type User @entity(immutable: false) {
  id: Bytes! # User address
  totalClaimed: BigInt! # Total amount claimed across all pools
  totalFeesPaid: BigInt! # Total fees paid across all pools
  uniquePools: BigInt! # Number of unique pools claimed from
  totalClaims: BigInt! # Total number of claims
  
  # Relations
  claims: [Claim!]! @derivedFrom(field: "user")
  fundings: [Funding!]! @derivedFrom(field: "funder")
  withdrawals: [Withdrawal!]! @derivedFrom(field: "creator")
  poolStates: [UserPoolState!]! @derivedFrom(field: "user")
  
  # Timestamps
  firstActivityAt: BigInt!
  lastActivityAt: BigInt!
}

# Tracks user's cumulative state per pool for proper incremental calculations
type UserPoolState @entity(immutable: false) {
  id: Bytes! # user address + pool address
  user: User! # User reference
  pool: Pool! # Pool reference
  lastCumulativeAmount: BigInt! # Last recorded cumulative amount
  totalClaimed: BigInt! # Total incremental amount claimed from this pool
  totalFeesPaid: BigInt! # Total fees paid on this pool
  claimCount: BigInt! # Number of claims from this pool
  
  # Timestamps
  firstClaimAt: BigInt!
  lastClaimAt: BigInt!
}

type Claim @entity(immutable: true) {
  id: Bytes! # Transaction hash + log index
  pool: Pool! # Pool contract
  user: User! # User who claimed
  cumulativeAmount: BigInt! # Cumulative amount (from event)
  grossAmount: BigInt! # Amount claimed this time (calculated)
  feeAmount: BigInt! # Platform fee deducted
  netAmount: BigInt! # Net amount received by user
  
  # Transaction Info
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  gasUsed: BigInt! # Gas used for this claim
  gasPrice: BigInt! # Gas price paid
}

type Funding @entity(immutable: true) {
  id: Bytes! # Transaction hash + log index
  pool: Pool! # Pool funded
  funder: User! # Who funded the pool
  amount: BigInt! # Amount funded
  
  # Transaction Info
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

type Withdrawal @entity(immutable: true) {
  id: Bytes! # Transaction hash + log index
  pool: Pool! # Pool withdrawn from
  creator: User! # Pool creator who withdrew funds
  amount: BigInt! # Amount withdrawn
  
  # Transaction Info
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

# Batch Claims and Router Analytics
type BatchClaim @entity(immutable: true) {
  id: Bytes! # Transaction hash
  caller: Bytes! # Who initiated the batch
  successful: BigInt! # Number of successful claims
  failed: BigInt! # Number of failed claims
  totalGross: BigInt! # Total gross amount
  totalFees: BigInt! # Total fees
  totalNet: BigInt! # Total net amount
  
  # Gas Analytics
  gasUsed: BigInt! # Total gas used
  gasPrice: BigInt! # Gas price
  gasCost: BigInt! # Total gas cost in wei
  
  # Relations
  successes: [ClaimSuccess!]! @derivedFrom(field: "batchClaim")
  failures: [ClaimFailure!]! @derivedFrom(field: "batchClaim")
  
  # Timestamps
  timestamp: BigInt!
  blockNumber: BigInt!
}

type ClaimSuccess @entity(immutable: true) {
  id: Bytes! # Transaction hash + log index
  batchClaim: BatchClaim! # Parent batch
  vault: Bytes! # Vault address
  account: Bytes! # Account that received funds
  factory: Bytes! # Factory that created the vault
  gross: BigInt! # Gross amount
  fee: BigInt! # Fee amount
  net: BigInt! # Net amount
}

type ClaimFailure @entity(immutable: true) {
  id: Bytes! # Transaction hash + log index
  batchClaim: BatchClaim! # Parent batch
  vault: Bytes! # Vault address
  account: Bytes! # Account that should have received funds
  reason: String! # Failure reason
}

# Publisher Management
type PublisherRotation @entity(immutable: true) {
  id: Bytes! # Transaction hash
  factory: Factory! # Factory where rotation occurred
  oldPublisher: Bytes! # Previous publisher
  newPublisher: Bytes! # New publisher
  graceEndTime: BigInt! # When grace period ends
  status: PublisherRotationStatus! # Current status
  
  # Timestamps
  initiatedAt: BigInt!
  completedAt: BigInt # When rotation completed (if cancelled)
}

enum PublisherRotationStatus {
  ACTIVE # Rotation in progress
  CANCELLED # Rotation was cancelled
  COMPLETED # Grace period ended
}

# Analytics and Search Entities
type FactoryStats @entity(immutable: false) {
  id: String! # "factory-stats"
  totalPools: BigInt!
  totalVolume: BigInt!
  totalFees: BigInt!
  totalUsers: BigInt!
  totalClaims: BigInt!
  averagePoolSize: BigInt!
  
  # Updated daily
  updatedAt: BigInt!
}

type DailyStatistic @entity(immutable: false) {
  id: String! # "YYYY-MM-DD"
  date: String!
  poolsCreated: BigInt!
  volume: BigInt!
  fees: BigInt!
  uniqueUsers: BigInt!
  totalClaims: BigInt!
  batchClaims: BigInt!
  
  # Gas Analytics
  averageGasPrice: BigInt!
  totalGasUsed: BigInt!
  averageClaimCost: BigInt!
}

# Pool Metadata Management
type PoolMetadataUpdate @entity(immutable: true) {
  id: Bytes!
  pool: Pool!
  updater: Bytes!
  skills: [String!]!
  description: String
  searchString: String!
  timestamp: BigInt!
  blockNumber: BigInt!
}

# Referral System
type Referrer @entity(immutable: false) {
  id: Bytes! # Referrer address
  totalRewards: BigInt! # Total referral rewards earned
  totalReferrals: BigInt! # Number of unique users referred
  totalClaims: BigInt! # Number of claims with this referrer
  rewards: [ReferralReward!]! @derivedFrom(field: "referrer")
  
  # Timestamps
  firstReferralAt: BigInt!
  lastReferralAt: BigInt!
}

type ReferralReward @entity(immutable: true) {
  id: Bytes! # Transaction hash + log index
  pool: Pool! # Pool where the claim happened
  referrer: Referrer! # Referrer who earned the reward
  farmer: Bytes! # User (farmer) who claimed
  amount: BigInt! # Referral reward amount
  
  # Transaction Info
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

# ========================================
# DATAMARKETPLACE ENTITIES
# ========================================

# Dataset Factory and Management
type DatasetFactory @entity(immutable: false) {
  id: Bytes! # Factory contract address
  datasetTokenImplementation: Bytes! # Dataset token implementation address
  bondingCurveImplementation: Bytes! # Bonding curve implementation address
  clonesToken: Bytes! # CLONES token address
  protocolFeeRecipient: Bytes! # Protocol fee recipient
  timelock: Bytes! # Timelock contract address
  guardian: Bytes! # Guardian address
  graduationManager: Bytes # Graduation manager address
  burnPortal: Bytes # Burn portal address
  
  # Configuration
  fallbackLaunchFee: BigInt! # Fallback launch fee in CLONES
  useOracle: Boolean! # Whether to use oracle for pricing
  
  # Statistics
  totalDatasets: BigInt! # Total number of datasets created
  totalVolume: BigInt! # Total trading volume across all datasets
  totalFees: BigInt! # Total fees collected
  
  # Relations
  datasets: [Dataset!]! @derivedFrom(field: "factory")
  
  # Timestamps
  createdAt: BigInt!
  createdAtBlock: BigInt!
  updatedAt: BigInt!
}

# Core Dataset Entity
type Dataset @entity(immutable: false) {
  id: Bytes! # Dataset token address
  factory: DatasetFactory! # Factory that created this dataset
  creator: DatamarketplaceUser! # Dataset creator entity
  bondingCurve: BondingCurve! # Associated bonding curve
  
  # Token Info
  name: String! # Dataset name
  symbol: String! # Dataset symbol
  totalSupply: BigInt! # Total token supply (fixed at 1B)
  decimals: Int! # Token decimals (6)
  
  # Dataset Configuration
  burnThresholdPercentage: Int! # Burn threshold percentage (1-10%)
  burnThreshold: BigInt! # Actual burn threshold amount
  
  # State
  isGraduated: Boolean! # Whether dataset has graduated
  isActive: Boolean! # Whether dataset is active for burning
  
  # Statistics
  totalVolume: BigInt! # Total trading volume
  totalBurned: BigInt! # Total tokens burned for access
  totalAccesses: BigInt! # Number of unique users who burned for access
  uniqueTraders: BigInt! # Number of unique traders
  totalTrades: BigInt! # Total number of trades
  
  # Relations
  trades: [Trade!]! @derivedFrom(field: "dataset")
  burns: [BurnForAccess!]! @derivedFrom(field: "dataset")
  graduation: Graduation # Graduation info (if graduated)
  burnPortal: BurnPortal # Burn portal (if activated)
  
  # Deployment Info
  salt: Bytes! # CREATE2 salt
  nonce: BigInt! # Creator nonce
  
  # Timestamps
  createdAt: BigInt!
  createdAtBlock: BigInt!
  graduatedAt: BigInt # Graduation timestamp
  activatedAt: BigInt # Burn activation timestamp
}

# Bonding Curve for each Dataset
type BondingCurve @entity(immutable: false) {
  id: Bytes! # Bonding curve contract address
  dataset: Dataset! # Associated dataset
  factory: DatasetFactory! # Factory reference
  
  # Oracle Configuration
  ethUsdPriceFeed: Bytes! # ETH/USD price feed address
  
  # Virtual Reserves (K = V_ETH × V_TOK)
  virtualEthReserves: BigInt! # Virtual ETH reserves
  virtualTokenReserves: BigInt! # Virtual token reserves
  
  # Current State
  currentPrice: BigInt! # Current token price in wei
  currentMarketCap: BigInt! # Current market cap in ETH
  graduationThreshold: BigInt! # Graduation threshold in ETH
  
  # Trading Statistics
  totalBuys: BigInt! # Total number of buy transactions
  totalSells: BigInt! # Total number of sell transactions
  totalVolumeETH: BigInt! # Total volume in ETH
  totalVolumeTokens: BigInt! # Total volume in tokens
  totalCreatorFees: BigInt! # Total creator fees collected
  totalProtocolFees: BigInt! # Total protocol fees collected
  
  # State Flags
  isGraduated: Boolean! # Whether curve has graduated
  
  # Relations
  trades: [Trade!]! @derivedFrom(field: "bondingCurve")
  
  # Timestamps
  createdAt: BigInt!
  graduatedAt: BigInt # When graduation was triggered
}

# Trading Activity
type Trade @entity(immutable: true) {
  id: Bytes! # Transaction hash + log index
  dataset: Dataset! # Dataset being traded
  bondingCurve: BondingCurve! # Bonding curve used
  trader: DatamarketplaceUser! # Trader entity
  
  # Trade Details
  type: TradeType! # BUY or SELL
  ethAmount: BigInt! # ETH amount (spent on buy, received on sell)
  tokenAmount: BigInt! # Token amount (received on buy, sold on sell)
  
  # Fees
  creatorFee: BigInt! # Fee paid to creator
  protocolFee: BigInt! # Fee paid to protocol
  
  # Price Info
  priceAfter: BigInt! # Token price after trade
  marketCapAfter: BigInt! # Market cap after trade
  
  # Transaction Info
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  gasUsed: BigInt!
  gasPrice: BigInt!
}

enum TradeType {
  BUY
  SELL
}

# Burn for Access Events
type BurnForAccess @entity(immutable: true) {
  id: Bytes! # Transaction hash + log index
  dataset: Dataset! # Dataset accessed
  burner: DatamarketplaceUser! # User who burned tokens
  burnPortal: BurnPortal! # Burn portal used
  amount: BigInt! # Amount of tokens burned
  burnThreshold: BigInt! # Required burn threshold at time of burn
  
  # Transaction Info
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

# Graduation Events
type Graduation @entity(immutable: true) {
  id: Bytes! # Dataset token address
  dataset: Dataset! # Dataset that graduated
  bondingCurve: BondingCurve! # Bonding curve that triggered graduation
  graduationManager: GraduationManager! # Graduation manager entity
  
  # Graduation Details
  finalMarketCap: BigInt! # Final market cap at graduation
  ethReserves: BigInt! # ETH reserves at graduation
  tokenReserves: BigInt! # Token reserves at graduation
  
  # Uniswap LP Info
  lpPair: Bytes! # Uniswap V2 pair address
  ethContributed: BigInt! # ETH contributed to LP
  tokensContributed: BigInt! # Tokens contributed to LP
  lpTokensBurned: BigInt! # LP tokens burned to 0xdead
  
  # Transaction Info
  transactionHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

# Burn Portal Management
type BurnPortal @entity(immutable: false) {
  id: Bytes! # Burn portal contract address
  datasetFactory: Bytes! # Associated dataset factory
  graduationManager: Bytes! # Associated graduation manager
  
  # Statistics
  totalDatasets: BigInt! # Number of datasets activated
  totalBurns: BigInt! # Total burn events
  totalTokensBurned: BigInt! # Total tokens burned across all datasets
  uniqueBurners: BigInt! # Number of unique burners
  
  # Relations
  activatedDatasets: [Dataset!]! @derivedFrom(field: "burnPortal") # Datasets activated for burning
  burns: [BurnForAccess!]! @derivedFrom(field: "burnPortal") # All burn events
  
  # Timestamps
  createdAt: BigInt!
  updatedAt: BigInt!
}

# Graduation Manager
type GraduationManager @entity(immutable: false) {
  id: Bytes! # Graduation manager contract address
  datasetFactory: Bytes! # Associated dataset factory
  burnPortal: Bytes! # Associated burn portal
  uniswapRouter: Bytes! # Uniswap V2 router address
  uniswapFactory: Bytes! # Uniswap V2 factory address
  
  # Statistics
  totalGraduations: BigInt! # Number of successful graduations
  totalLPCreated: BigInt! # Total LP value created in ETH
  
  # Relations
  graduations: [Graduation!]! @derivedFrom(field: "graduationManager")
  
  # Timestamps
  createdAt: BigInt!
  updatedAt: BigInt!
}

# Daily Analytics for Datamarketplace
type DatamarketplaceDailyStats @entity(immutable: false) {
  id: String! # "YYYY-MM-DD"
  date: String! # Human readable date
  
  # Dataset Activity
  datasetsCreated: BigInt! # New datasets created
  datasetsGraduated: BigInt! # Datasets that graduated
  
  # Trading Activity
  totalTrades: BigInt! # Total trades
  totalVolumeETH: BigInt! # Total volume in ETH
  totalVolumeTokens: BigInt! # Total volume in tokens
  uniqueTraders: BigInt! # Unique traders
  averageTradeSize: BigInt! # Average trade size in ETH
  
  # Burn Activity
  totalBurns: BigInt! # Total burn events
  totalTokensBurned: BigInt! # Total tokens burned
  uniqueBurners: BigInt! # Unique burners
  
  # Fees
  totalCreatorFees: BigInt! # Total creator fees
  totalProtocolFees: BigInt! # Total protocol fees
  
  # LP Activity
  totalLPValue: BigInt! # Total LP value created
}

# User Activity in Datamarketplace
type DatamarketplaceUser @entity(immutable: false) {
  id: Bytes! # User address
  
  # Dataset Creation
  datasetsCreated: BigInt! # Number of datasets created
  createdDatasets: [Dataset!]! @derivedFrom(field: "creator")
  
  # Trading Activity
  totalTrades: BigInt! # Total number of trades
  totalVolumeETH: BigInt! # Total trading volume in ETH
  totalFeesEarned: BigInt! # Total creator fees earned
  totalFeesPaid: BigInt! # Total fees paid as trader
  trades: [Trade!]! @derivedFrom(field: "trader")
  
  # Burn Activity
  totalBurns: BigInt! # Number of burn events
  totalTokensBurned: BigInt! # Total tokens burned
  uniqueDatasetsAccessed: BigInt! # Number of unique datasets accessed
  burns: [BurnForAccess!]! @derivedFrom(field: "burner")
  
  # Timestamps
  firstActivityAt: BigInt! # First interaction timestamp
  lastActivityAt: BigInt! # Last interaction timestamp
}